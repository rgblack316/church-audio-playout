[package]
name = "church-playout"
version = "0.1.0"
edition = "2021"
description = "Church service music playout"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
playout-core = { path = "../crates/playout-core" }
