[package]
name = "church-playout"
version = "1.0.0"
edition = "2021"
description = "Church service music playout"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
playout-core = { path = "../crates/playout-core" }
playout-audio = { path = "../crates/playout-audio" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fs2 = "0.4"
ureq = { version = "2", default-features = false, features = [] }

# Windows Media Foundation fallback decoder (WMA etc.) only exists on Windows.
[target.'cfg(windows)'.dependencies]
playout-audio = { path = "../crates/playout-audio", features = ["mf"] }
