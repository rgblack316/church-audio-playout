name: Build macOS and Linux

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            bundles: deb,appimage
            args: ""
            glob: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
          - name: macos-arm64
            os: macos-latest
            bundles: dmg
            args: "--target aarch64-apple-darwin"
            target: aarch64-apple-darwin
            glob: |
              target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macos-intel
            os: macos-latest
            bundles: dmg
            args: "--target x86_64-apple-darwin"
            target: x86_64-apple-darwin
            glob: |
              target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        if: matrix.name == 'linux'
        run: cargo test -p playout-core -p playout-audio

      - name: Install Tauri CLI (prebuilt)
        run: npm install -g @tauri-apps/cli@^2

      - name: Build
        working-directory: src-tauri
        env:
          # Ad-hoc signature ("-"): macOS on Apple Silicon refuses to run completely unsigned apps.
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.name, 'macos') && '-' || '' }}
        run: tauri build --bundles ${{ matrix.bundles }} ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: church-playout-${{ matrix.name }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
